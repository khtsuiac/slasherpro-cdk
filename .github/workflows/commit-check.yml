name: "Commit Message Governance"

on:
  pull_request:
    branches:
      - dev
      - uat
      - uatx
      - prod
      - main
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  check-commit-message:
    name: "Validate Commit Message Format"
    runs-on: ubuntu-latest
    steps:
      - name: Check Commit Messages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PATTERN: '^\[(SPH|SPN|SPE)[0-9]+\] .+'
          ERROR_MSG: 'Commit messages must start with a valid requirement ID and description (e.g., [SPH123] Fix leave balance, [SPN123] Update profile, or [SPE123] Add ticket tier).'
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          pattern = re.compile(os.environ["PATTERN"])
          error_msg = os.environ["ERROR_MSG"]

          output = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/pulls/{pr}/commits", "--paginate", "--jq", r'.[].commit.message | split("\n")[0]'],
              text=True
          )

          subjects = [line.strip() for line in output.splitlines() if line.strip()]
          if not subjects:
              print("No commits found on pull request.")
              sys.exit(1)

          failed = [msg for msg in subjects if not pattern.match(msg)]
          if failed:
              for msg in failed:
                  print(f"❌ Invalid commit message: {msg}")
              print(f"\nError: {error_msg}")
              sys.exit(1)

          print(f"✅ All {len(subjects)} commit message(s) match {os.environ['PATTERN']}")
          EOF